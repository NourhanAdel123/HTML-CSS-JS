<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>List Task</title>
  </head>
  <body>
<ul> <!-- bullet list -->
  <li>One
    <ol type="A" start="3"> <!-- C, D, E -->
      <li>C</li>
      <li>D</li>
      <li>E</li>
    </ol>
  </li>
  <li>Two
    <ol type="I" start="3"> <!-- III, IV, V -->
      <li>3</li>
      <li>4</li>
      <li>5</li>
    </ol>
  </li>
  <li>Three
    <ol type="a" start="4"> <!-- d, c, b -->
      <li>d</li>
      <li>c</li>
      <li>b</li>
    </ol>
  </li>
</ul>
  </body>
</html>
