<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task Form</title>

    <style>
      body {
        background: #5a2ca0;
        margin: 0;
        padding: 10px;
        font-family: Tahoma;
      }

      .container {
        background: brown;
        border: 2px solid white;
        min-height: 95vh;
        padding: 15px;
        position: relative;
      }

      .title {
        position: absolute;
        top: -12px;
        left: 15px;
        background: orange;
        padding: 2px 10px;
        font-weight: bold;
      }

      .box {
        margin-top: 40px;
        border: 2px solid #ddd;
        background: olive;
        padding: 20px;
        position: relative;
        height: 100px;
      }

      .name-label {
        position: absolute;
        top: -40px;
        left: 15px;
        background: blue;
        color: black;
        padding: 25px 20px;
        font-size: 18px;
      }

      .row {
        margin: 10px 0;
      }

      label {
        display: inline-block;
        width: 110px;
        font-size: 18px;
      }

      input[type="text"],
      input[type="email"],
      input[type="password"],
      input[type="number"] {
        width: 200px;
        height: 25px;
      }

      .section {
        margin-top: 40px;
      }

      .radio-group {
        margin-top: 20px;
      }

      select {
        width: 170px;
        height: 30px;
        font-size: 18px;
      }

      .submit-btn {
        margin-top: 20px;
        width: 90px;
        height: 35px;
        border-radius: 20px;
        border: none;
        background: linear-gradient(to bottom, #ff6a00, #8b0000);
        color: white;
        font-weight: bold;
        cursor: pointer;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <div class="title">Personal Data</div>

      <div class="box">
        <div class="name-label">Your Name</div>

        <div class="row">
          <label>FirstName :</label>
          <input type="text" placeholder="FirstName..." />
        </div>

        <div class="row">
          <label>LastName :</label>
          <input type="text" placeholder="LastName..." />
        </div>
      </div>

      <div class="section">
        <div class="row">
          <label>Phone :</label>
          <input type="number" />
        </div>

        <div class="row">
          <label>Email :</label>
          <input type="email" />
        </div>

        <div class="row">
          <label>Password :</label>
          <input type="password" />
        </div>

        <div class="row">
          <label>re-password :</label>
          <input type="password" />
        </div>

        <div class="radio-group">
          <div class="row">
            <label>Male :</label>
            <input type="radio" name="gender" value="male" />
          </div>

          <div class="row">
            <label>FeMale :</label>
            <input type="radio" name="gender" vlaue="female" />
          </div>
        </div>

        <div class="radio-group">
          <div class="row">
            <label>student :</label>
            <input type="radio" name="status" value="student" />
          </div>

          <div class="row">
            <label>graduated :</label>
            <input type="radio" name="status" vlaue="graduated" />
          </div>
        </div>

        <div class="row">
          <label>Choose a car:</label>

          <select>
            <option>Mercedes CLA</option>
            <option>BMW</option>
            <option>KIA</option>
            <option>Audi</option>
          </select>
        </div>

        <input type="submit" value="Submit" class="submit-btn" />
      </div>
    </div>
  </body>
</html>
